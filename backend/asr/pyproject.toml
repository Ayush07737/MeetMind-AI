[project]
name = "meetmind-asr"
version = "0.1.0"
description = "MeetMind AI — Speech-to-Text Streaming Pipeline (§2)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis[hiredis]>=5.0",
    "websockets>=14.0",
    "httpx>=0.27",
    "meetmind-security",
    "meetmind-schemas",
]

[tool.uv.sources]
meetmind-security = { workspace = true }
meetmind-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meetmind_asr"]

