[project]
name = "meetmind-gateway"
version = "0.1.0"
description = "MeetMind AI — Ingestion Gateway & WebSocket Core (§1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meetmind_gateway"]
