[project]
name = "meetmind-gateway"
version = "0.1.0"
description = "MeetMind AI — Ingestion Gateway & WebSocket Core (§1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
    "redis[hiredis]>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
    "meetmind-security",
]

[tool.uv.sources]
meetmind-security = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meetmind_gateway"]