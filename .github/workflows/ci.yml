name: CI

on:
  push:
    branches: [main, s1-hardening]
  pull_request:
    branches: [main, s1-hardening]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint, Format & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Ruff Lint & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: ESLint & Prettier Check
        run: |
          pnpm lint
          pnpm format:check

      - name: Vitest Workspace Tests
        run: pnpm test

      - name: Pytest Unit Tests (non-integration)
        run: uv run pytest -m "not integration"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Run Integration Tests with Redis & Neon (if secret present)
        env:
          REDIS_URL: redis://localhost:6379/0
          NEON_TEST_DB: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: |
          if [ -n "$NEON_TEST_DB" ]; then
            echo "Running full integration test suite against Neon and Redis..."
            NEON_DATABASE_URL="$NEON_TEST_DB" uv run pytest -m "integration"
          else
            echo "::warning title=Integration Skipped::NEON_TEST_DATABASE_URL is not set. Live database integration tests skipped on this run."
            echo "Running Redis-only integration tests..."
            uv run pytest backend/gateway/tests -k "redis or stream" -m "not integration"
          fi
