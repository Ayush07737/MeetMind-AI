[project]
name = "meetmind-schemas"
version = "0.1.0"
description = "MeetMind AI - Shared Pydantic + Event Schemas"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meetmind_schemas"]
