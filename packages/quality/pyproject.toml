[project]
name = "meetmind-quality"
version = "0.1.0"
description = "MeetMind AI — Quality, Verification & Abstention Library (Q4)"
requires-python = ">=3.12"
dependencies = [
    "meetmind-schemas",
    "pydantic>=2.10",
]

[tool.uv.sources]
meetmind-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meetmind_quality"]

